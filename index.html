</style></head><body><div class="wrap"><header class="top"><div><div class="brand">◈ Økonemt</div><div class="muted">Din økonomi. Gjort nemt.</div></div><div class="header-meta"><span class="tag">Økonemt · prøveversion 77</span><span id="lastSavedDate" class="small muted" aria-live="polite">Endnu ikke gemt</span></div></header><div class="progress"><div class="bar" id="bar" style="width:0%"></div></div><main id="app"></main><div class="footer">Illustrative standardbeløb, bilforbrug og udgiftstidspunkter – ikke dokumenterede danske gennemsnit. Ingen bankforbindelse eller serverlagring. Brugeren kan ændre alle oplysninger.</div></div><script>

const defaults={persons:1,akasseMembers:0,income:36000,otherIncomes:[],home:'house',outbuildingCount:0,outbuildingType:'barn',outbuildingArea:80,outbuildingRoofAge:20,outbuildingFacadeAge:20,area:130,ownership:'owner',heat:'district',roof:'tile',roofAge:20,windowsAge:15,doorsAge:15,gutterAge:20,facadeAge:20,heatAge:12,bathAge:15,kitchenAge:15,car:'petrol',km:16000,cars:0,subscriptions:[],otherSubscriptions:0,streamMonthly:0,childrenCount:0,children:[],hasPets:'no',petType:'dog',petCount:1,otherPlans:0,otherPlansYears:5,travelAnnual:0,buffer:30000,bufferCurrent:0,bufferYears:2,futureSavingsPool:0,inflation:2,customItems:[],hiddenItems:[],futureOverrides:{},personalFuture:[],homepayment:7500,loans:[],extraDebtPayment:0,investStart:0,investMonthly:0,investYears:20,investReturn:5,investGoal:"security",savingsMode:"grow",savingsWithdrawal:0,deficitFreeSavings:0,vehicles:[],motorcycles:[],ageSeparate:{},ageReferenceYear:2026,lastAnnualReview:'2026-10-19',futureStatus:{},futureCondition:{}};
let d={...defaults}, edits={}; let undoStack=[];let lastSavedTimestamp=null;
const SAVE_KEY='pengepilot-autosave-v32';let saveTimer=null,restoring=false;

function row(key,label,value,custom=false){let v=edits[key]??value;const safe=escapeHtml(label);return `<div id="budget-item-${encodeURIComponent(key)}" class="budget-edit-row" style="scroll-margin-top:28px"><div class="budget-edit-name">${safe}${(!custom&&!key.startsWith('loan|')&&!key.startsWith('reserve|'))?`<span class="estimate-note">${Object.prototype.hasOwnProperty.call(edits,key)?'Tilrettet':'Vejledende'}</span>`:''}</div><label class="budget-cell"><span class="screen-reader-only">${safe} pr. måned</span><input class="budgetinput" aria-label="${safe} måned" data-edit="${key}" type="number" min="0" step="1" value="${Math.round(v)}"></label><label class="budget-cell"><span class="screen-reader-only">${safe} pr. kvartal</span><input class="budgetinput" aria-label="${safe} kvartal" data-quarter="${key}" type="number" min="0" step="1" value="${Math.round(v*3)}"></label><label class="budget-cell"><span class="screen-reader-only">${safe} pr. år</span><input class="budgetinput" aria-label="${safe} år" data-annual="${key}" type="number" min="0" step="1" value="${Math.round(v*12)}"></label>${key.startsWith('loan|')?`<button class="secondary budget-row-remove" data-budget-loan-details="1" title="Redigér lånet" aria-label="Redigér lånet" type="button">⋯</button>`:custom?`<button class="secondary budget-row-remove" data-remove-item="${encodeURIComponent(key)}" title="Fjern post" aria-label="Fjern ${safe}" type="button">−</button>`:`<button class="secondary budget-row-remove" data-hide-item="${encodeURIComponent(key)}" title="Fjern standardpost" aria-label="Fjern ${safe}" type="button">−</button>`}</div>`}

function collectChildren(){const n=Math.min(8,Math.max(0,Number(d.childrenCount)||0));const result=Array.from({length:n},(_,i)=>({...d.children?.[i]}));document.querySelectorAll('[data-child]').forEach(el=>{const i=Number(el.dataset.child),k=el.dataset.prop;if(i>=n)return;result[i][k]=el.type==='checkbox'?el.checked:k==='name'?el.value.trim():Number(el.value)||0});d.children=result;}

function repayment(balance,annualRate,payment){let r=Math.max(0,annualRate)/1200,b=Math.max(0,balance);if(!b)return {months:0,interest:0};if(payment<=b*r)return {months:Infinity,interest:Infinity};let months=0,interest=0;while(b>0.005&&months<1200){const cost=b*r;interest+=cost;b=Math.max(0,b+cost-payment);months++;}return months>=1200&&b>0.005?{months:Infinity,interest:Infinity}:{months,interest};}

 <div class="card priority-card" style="padding:16px"><b>Hvad er værd at se på først?</b><p style="margin-bottom:4px">${focus}</p><p class="muted small">Vejledning ud fra de tal, du har oplyst – ikke individuel investeringsrådgivning.</p></div>

function electricCarComparison(futureItem){
 const match=String(futureItem.label||'').match(/^Fremtidig biludskiftning · (.*)$/);
 if(!match)return '';
 const v=vehicles().find((car,i)=>vehicleName(car,i)===match[1]);
 if(!v || !['petrol','diesel'].includes(v.type))return '';
 const current=Object.values(vehicleEnergy(v)).reduce((a,n)=>a+n,0);
 const km=Math.max(0,Number(v.km)||0);
 const electricity=km/12/100*sources.elecEfficiency*sources.electricRate;
 const difference=current-electricity;
 const annual=difference*12;
 const currentName=v.type==='diesel'?'Diesel':'Benzin';
 return `<details class="car-compare"><summary>Hvad hvis du skifter til elbil?</summary><div class="car-compare-grid"><span>${currentName} pr. måned</span><strong>${fmt(current)}</strong><span>Vejledende opladning pr. måned</span><strong>${fmt(electricity)}</strong><span>${difference>=0?'Mulig besparelse pr. måned':'Mulig merudgift pr. måned'}</span><strong>${fmt(Math.abs(difference))}</strong><span>${difference>=0?'Mulig besparelse pr. år':'Mulig merudgift pr. år'}</span><strong>${fmt(Math.abs(annual))}</strong></div><p class="muted small">Beregnet ved ${Math.round(km).toLocaleString('da-DK')} km/år. Forudsætter ${sources.elecEfficiency} kWh/100 km og ${sources.electricRate.toLocaleString('da-DK')} kr./kWh. Kun vejledende energiudgifter – ikke samlet biløkonomi. Bilens købspris, værditab, finansiering, forsikring og øvrig drift er ikke med.</p></details>`;
}

rm="${cat}" style="padding:15px;margin:10px 0"><div class="grid"><label class="field">Navn på budgetpost<input data-new-name="${cat}" type="text" list="suggestions-${Object.keys(categorySuggestions).indexOf(cat)}" placeholder="Vælg et forslag eller skriv selv" autocomplete="off"><datalist id="suggestions-${Object.keys(categorySuggestions).indexOf(cat)}">${suggestionOptions(cat,b.items)}</datalist><span class="muted small">Forslagene passer til ${cat.toLowerCase()}. Du kan også skrive en helt ny post.</span></label><div class="field"><label for="new-amount-${Object.keys(categorySuggestions).indexOf(cat)}">Beløb (kr.)</label><input id="new-amount-${Object.keys(categorySuggestions).indexOf(cat)}" data-new-month="${cat}" type="number" min="0" step="1" value="0"><label for="new-period-${Object.keys(categorySuggestions).indexOf(cat)}">Hvor ofte?</label><select id="new-period-${Object.keys(categorySuggestions).indexOf(cat)}" data-new-period="${cat}"><option value="month">Månedligt</option><option value="quarter">Kvartalsvis</option><option value="year">Årligt</option></select></div>${cat==='Lån (uden realkredit)'?`<label class="field">Restgæld (kr.)<input data-new-balance type="number" min="0" value="0"></label><label class="field">Årlig rente (%)<input data-new-rate type="number" min="0" max="100" step="0.1" value="0"></label>`:''}</div><div class="actions"><button type="button" data-save-cat="${cat}">Tilføj budgetpost</button><button type="button" class="secondary" data-cancel-cat="${cat}">Annuller</button></div><p class="muted small" data-add-error="${cat}" role="status"></p></div></div></details>`).join('');}
 const upcoming=[...b.future].filter(x=>x.label!=='Nødbuffer').sort((x,y)=>x.years-y.years);const nearest=upcoming[0];const futureMonthly=upcoming.reduce((sum,x)=>sum+(Number(x.monthly)||0),0);return `<h3 class="sectionTitle">Kommende større udgifter</h3><p class="muted">Tryk på en udgift for at se eller rette detaljerne.</p><div class="future-topline"><div><small>Næste større udgift</small><strong>${nearest?'Om '+nearest.years+' år':'Ingen registreret'}</strong><small>${nearest?escapeHtml(nearest.customFuture?nearest.name:nearest.label):'Tilføj en udgift nedenfor'}</small></div><div><small>Opsparing til kommende udgifter</small><strong>${fmt(futureMonthly)}/md.</strong><small>Ekskl. nødopsparing</small></div></div><details class="future-pool-panel" id="future-pool-panel"><summary>Har du allerede sparet op til fremtidige udgifter? <span class="future-pool-amount">${Number(d.futureSavingsPool)>0?fmt(d.futureSavingsPool):'Valgfrit'}</span></summary><div class="future-pool-content"><p class="muted small">Beløbet fordeles automatisk til de nærmeste fremtidige udgifter. Nødreserven holdes udenfor.</p><label class="field">Opsparet beløb (kr.)<input id="futureSavingsPool" type="number" min="0" step="100" value="${Math.max(0,Number(d.futureSavingsPool)||0)}"></label><p class="muted small">Endnu ikke fordelt: <b>${fmt(Math.max(0,Number(d.futureSavingsPool)||0)-b.future.filter(x=>x.label!=='Nødbuffer').reduce((sum,x)=>sum+(x.allocated||0),0))}</b></p><div class="budget-icon-actions">${localUndo(true)}</div></div></details><div class="field" style="max-width:250px"><label>Årlig prisstigning (%)</label><input id="inflation" type="number" min="0" max="25" step="0.5" value="${num('inflation')}"></div>`+[...b.future].sort((a,b)=>a.label==='Nødbuffer'?1:b.label==='Nødbuffer'?-1:a.years-b.years).map(x=>x.label==='Nødbuffer'?`<details class="card buffer-fold" id="future-buffer" style="padding:14px;margin:12px 0;scroll-margin-top:18px" ${bufferOpenOverride===null?(num('buffer')>0&&num('bufferCurrent')>=num('buffer')?'':'open'):(bufferOpenOverride?'open':'')}><summary class="buffer-fold-summary"><span><strong>${num('buffer')>0&&num('bufferCurrent')>=num('buffer')?'Nødreserve opnået':'Penge til uforudsete udgifter / buffer'}</strong><small>${fmt(Math.max(0,num('bufferCurrent')))} af ${fmt(Math.max(0,num('buffer')))} · ${num('buffer')>0?Math.min(100,Math.round(Math.max(0,num('bufferCurrent'))/num('buffer')*100)):0} %</small></span><span class="buffer-fold-chevron" aria-hidden="true">▾</span></summary><div class="buffer-fold-body"><p class="muted small">Vælg selv dit mål, det beløb du allerede har sparet op, og hvornår du ønsker at nå målet. Kun det manglende beløb fordeles over perioden. Ingen prisstigning anvendes på bufferen.</p><div class="buffer-progress" aria-label="Fremgang mod nødreserve"><div class="buffer-progress-top"><span>Opsparet <strong>${fmt(Math.min(Math.max(0,num('bufferCurrent')),Math.max(0,num('buffer'))))}</strong> af ${fmt(Math.max(0,num('buffer')))}</span><strong>${num('buffer')>0?Math.min(100,Math.round(Math.max(0,num('bufferCurrent'))/num('buffer')*100)):100} %</strong></div><div class="buffer-progress-track"><div class="buffer-progress-fill" style="width:${num('buffer')>0?Math.min(100,Math.max(0,num('bufferCurrent'))/num('buffer')*100):100}%"></div></div></div><div class="grid"><label class="field">Ønsket buffer (kr.)<input id="bufferGoalFuture" type="number" min="0" step="100" value="${Math.max(0,num('buffer'))}"></label><label class="field">Allerede opsparet (kr.)<input id="bufferCurrentFuture" type="number" min="0" step="100" value="${Math.max(0,num('bufferCurrent'))}"></label><label class="field" id="bufferYearsFutureField" ${num('bufferCurrent')>=num('buffer')?'style="display:none"':''}>Opbyg bufferen over (år)<input id="bufferYearsFuture" type="number" min="1" step="1" value="${Math.max(1,num('bufferYears'))}"></label></div><div class="tiles"><div class="tile">Mangler at opspare<b>${fmt(Math.max(0,num('buffer')-num('bufferCurrent')))}</b></div><div class="tile">Afsæt pr. måned<b>${fmt(x.monthly)}</b></div><div class="tile">Afsæt pr. år<b>${fmt(x.monthly*12)}</b></div></div><div class="local-tools">${localUndo(true)}</div></div></details>`:`<div class="card" id="${x.label==='Nødbuffer'?'future-buffer':'future-'+encodeURIComponent(x.label)}" style="padding:14px;margin:12px 0;scroll-margin-top:18px"><details class="future-details"><summary class="future-summary"><span><b>${x.customFuture?escapeHtml(x.name):escapeHtml(x.label)}</b>${x.customFuture?'<span class="estimate-note">Egen udgift</span>':futureStatusBadge(x)}<small>Om ${x.years} år · ${fmt(x.futureCost)} · ${fmt(x.monthly)}/md.</small></span><span class="future-chevron">Ret <span aria-hidden="true">▾</span></span></summary><div class="future-expanded"><div class="future-simple"><div><span class="muted small">Forventet arbejde om</span><div class="future-years-control"><button type="button" class="secondary" data-future-step="-1" data-future-key="${encodeURIComponent(x.label)}" aria-label="Et år tidligere">−</button><strong>${x.years} år</strong><button type="button" class="secondary" data-future-step="1" data-future-key="${encodeURIComponent(x.label)}" aria-label="Et år senere">+</button></div></div><div class="future-monthly"><span class="muted small">Afsæt pr. måned</span><strong>${fmt(x.monthly)}</strong></div></div><details class="future-more"><summary>Ret vejledende pris og detaljer</summary><div class="grid" style="margin-top:10px"><label class="field">Pris i dag (kr.)<input data-future-cost="${encodeURIComponent(x.label)}" type="number" min="0" value="${Math.round(x.cost)}"></label><label class="field">Antal år (præcist)<input data-future-years="${encodeURIComponent(x.label)}" type="number" min="1" value="${x.years}"></label></div>${x.customFuture?`<label class="field">Allerede opsparet (kr.)<input data-personal-saved="${x.id}" type="number" min="0" value="${Number(x.saved)||0}"></label>`:''}<p class="muted small">Anslået pris om ${x.years} år: <b>${fmt(x.futureCost)}</b>${x.noInflation?' (ingen prisstigning)':' · heraf forventet stigning '+fmt(x.futureCost-x.cost)}${x.allocated?' · dækket af fælles opsparing '+fmt(x.allocated):''}${x.customFuture?' · mangler at spare op '+fmt(Math.max(0,x.futureCost-(Number(x.saved)||0)-(x.allocated||0))):''}</p><div class="future-advanced-budget">${row('reserve|'+x.label,'Tilpas månedlig opsparing',x.monthly)}</div>${electricCarComparison(x)}</details>${futureExtras(x)}<div class="local-tools">${localUndo(true)}</div></div></details></div>`).join('')+completedFuturePanel()+personalFutureForm();

function personalizedTips(b){
 const tips=[], loans=debtInfo(), months=Math.max(0,Number(d.bufferYears)||1)*12;
 const goal=Math.max(0,num('buffer')), current=Math.max(0,num('bufferCurrent'));
 if(b.left<0)tips.push({title:'Budgettet mangler balance',info:'Dit foreslåede budget overstiger indkomsten med '+fmt(-b.left)+' hver måned. Gennemgå især de vejledende poster.',tab:'budget',priority:0});
 if(goal>current)tips.push({target:"future-buffer",title:'Få styr på din nødopsparing',info:'Du mangler '+fmt(goal-current)+' til dit mål. Forslaget er '+fmt((goal-current)/Math.max(1,months))+' pr. måned.',tab:'future',priority:d.investGoal==='security'?0:2});
 if(loans.top&&loans.top.rate>=7)tips.push({title:'Undersøg dit dyreste lån',info:'Et lån har '+Number(loans.top.rate).toLocaleString('da-DK')+' % årlig rente. Se hvad ekstra afdrag kan betyde.',tab:'debt',priority:d.investGoal==='debtfree'?0:1});
 const stream=b.items.find(x=>x.name==='Streaming og musik');if(stream&&stream.val>0)tips.push({target:'budget-item-'+encodeURIComponent(stream.key),title:'Tjek dine streamingabonnementer',info:'Du har afsat '+fmt(stream.val)+' om måneden ('+fmt(stream.val*12)+' om året). Kan nogle sættes på pause?',tab:'budget',priority:d.investGoal==='disposable'?0:3});
 if(b.future.length){const nearest=[...b.future].filter(x=>x.label!=='Nødbuffer').sort((a,c)=>a.years-c.years)[0];if(nearest)tips.push({target:'future-'+encodeURIComponent(nearest.label),title:'Se din næste store udgift',info:nearest.label+' ligger vejledende om '+nearest.years+' år. Kontrollér pris og tidspunkt.',tab:'future',priority:2});}
 if(b.left>0)tips.push({title:'Fordel dit frie rådighedsbeløb',info:'Du har '+fmt(b.left)+' tilbage før eventuelle frivillige ekstra afdrag og investeringer. Sammenlign mulighederne.',tab:'invest',priority:d.investGoal==='freedom'?0:4});
 return tips.sort((a,c)=>a.priority-c.priority).slice(0,3);
}

 const months=gap>0?Math.floor(free/gap):0;
 return `<div class="card" id="deficit-savings" style="padding:18px;border-color:#dfebeb;margin:18px 0">
 <h3 style="margin-top:0">Kan din opsparing hjælpe?</h3>

 <div class="field" style="max-width:380px"><label for="deficitFreeSavings">Min opsparing (kr.)</label><input id="deficitFreeSavings" type="number" min="0" step="1000" value="${free}"></div>
 <div class="tile"><span>Opsparingen kan dække underskuddet i cirka</span><b>${months} ${months===1?'måned':'måneder'}</b><small>Med uændret månedligt underskud.</small></div>

 <p class="muted small">Forenklet beregning uden afkast, inflation og skat. Et vedvarende underskud kræver også en langsigtet løsning.</p>
 </details></div>`;
}
function overviewStatus(b){
 const goal=Math.max(0,num('buffer')), current=Math.max(0,num('bufferCurrent'));
 const future=[...b.future].filter(x=>x.label!=='Nødbuffer').sort((a,c)=>a.years-c.years)[0];
 let items=[];
 if(b.left<0)items.push({symbol:'!',heading:'Der mangler '+fmt(-b.left)+' hver måned',desc:'Gennemgå dine udgifter, og ret de beløb, der ikke passer.',tab:'budget'});
 else items.push({symbol:'✓',heading:'Dit budget er i balance',desc:'Du har '+fmt(b.left)+' tilbage hver måned efter planlagt opsparing.'});
 if(goal>0&&current>=goal)items.push({symbol:'✓',heading:'Penge til uforudsete udgifter er opnået',desc:'Du har nået dit mål på '+fmt(goal)+'.',tab:'future',target:'future-buffer'});
 else if(goal>current)items.push({symbol:'!',heading:'Penge til uforudsete udgifter mangler '+fmt(goal-current),desc:'Opsparingen er med i budgettet.',tab:'future',target:'future-buffer'});
 if(future)items.push({symbol:'→',heading:'Næste større udgift: '+escapeHtml(future.label),desc:'Om '+future.years+' år · opsparingen er med i budgettet.',tab:'future',target:'future-'+encodeURIComponent(future.label)});
 return '<h3 class="sectionTitle">Dit økonomiske overblik</h3><div class="overview-status">'+items.map(item=>'<div class="overview-status-item"><span class="overview-status-icon" aria-hidden="true">'+item.symbol+'</span><div><b>'+item.heading+'</b><p class="muted small">'+item.desc+'</p></div>'+(item.tab?'<button class="secondary" type="button" data-go-tab="'+item.tab+'" data-go-target="'+(item.target||'')+'">Se mere →</button>':'')+'</div>').join('')+'</div>';
}
function journeyPanel(b){
 const bufferGoal=Math.max(0,num('buffer'));
 const bufferNow=Math.max(0,num('bufferCurrent'));
 const stages=[
  {name:'Få styr på budgettet',desc:'Gennemgå dine indtægter og udgifter.',done:!!d.journeyBudgetReviewed,tab:'budget',action:'journey-budget',actionLabel:'Jeg har gennemgået budgettet'},
  {name:'Skab en nødreserve',desc:bufferGoal>0?'Dit mål: '+fmt(bufferGoal)+' · opsparet: '+fmt(bufferNow):'Vælg et mål for din nødreserve.',done:bufferGoal>0&&bufferNow>=bufferGoal,tab:'future',target:'future-buffer'},
  {name:'Planlæg fremtidige udgifter',desc:'Gennemgå de kommende udgifter og ret dem, der ikke passer.',done:!!d.journeyFutureReviewed,tab:'future',action:'journey-future',actionLabel:'Jeg har gennemgået planen'},
  {name:'Vælg vej for din økonomi',desc:'Tag stilling til gæld og investering – begge dele er frivillige.',done:!!d.journeyStrategyReviewed,tab:'debt',action:'journey-strategy',actionLabel:'Jeg har taget stilling'}
 ];
 const done=stages.filter(x=>x.done).length;
 const nextIndex=stages.findIndex(x=>!x.done);
 const next=nextIndex>=0?stages[nextIndex]:null;
 const stageRow=(x,i)=>`<div class="journey-item ${x.done?'journey-done':''}"><span class="journey-number" aria-hidden="true">${x.done?'✓':i+1}</span><div class="journey-text"><b>${x.name}</b><p class="muted small">${x.desc}</p>${x.action&&!x.done?`<button type="button" class="journey-confirm" data-journey-complete="${x.action}">${x.actionLabel}</button>`:''}${x.action&&x.done?`<button type="button" class="journey-undo" data-journey-undo="${x.action}">Fortryd markering</button>`:''}</div><button type="button" class="secondary journey-link" data-go-tab="${x.tab}" ${x.target?'data-go-target="'+x.target+'"':''}>${x.done?'Se':'Gå til'} →</button></div>`;
 return `<section class="journey-panel journey-compact" aria-label="Din økonomiske rejse"><div class="journey-header"><h3>Din økonomiske rejse</h3><strong>${done} af 4 gennemført</strong></div><div class="journey-progress" role="progressbar" aria-label="Gennemførte skridt" aria-valuemin="0" aria-valuemax="4" aria-valuenow="${done}"><span style="width:${done*25}%"></span></div>${next?`<div class="journey-next"><span class="journey-next-label">Næste skridt</span>${stageRow(next,nextIndex)}</div>`:`<p class="journey-finished">✓ Du har taget stilling til alle fire områder. Du kan altid gennemgå dem igen.</p>`}<details class="journey-details"><summary>Se alle fire trin <span aria-hidden="true">⌄</span></summary><div class="journey-list">${stages.map(stageRow).join('')}</div><p class="muted small journey-foot">Du behøver ikke investere eller have en bestemt opsparing for at gennemføre din plan.</p></details></section>`;
}
function overviewPanel(b){const investMonthly=Math.max(0,num('investMonthly'));const remaining=b.left-investMonthly;const futureMonthly=Math.max(0,b.sums['Fremtidige udgifter']||0);const ordinaryMonthly=b.total-futureMonthly;const max=Math.max(1,investMonthly,...Object.values(b.sums));return `<div class="dashboard">

 <div class="highlight"><span>Tilbage hver måned</span><strong style="color:${remaining<0?'#b53737':'#087f73'}">${fmt(remaining)}</strong><small>Efter alm. udgifter, fremtidige udgifter og planlagt investering</small></div>
 <div class="tiles"><div class="tile">Indkomst pr. måned<b>${fmt(b.income)}</b><small>${fmt(b.income*12)} om året</small></div><div class="tile">Alm. udgifter<b>${fmt(ordinaryMonthly)}</b><small>inkl. låneydelser</small></div><div class="tile">Fremtidige udgifter<b>${fmt(futureMonthly)}</b><small>anbefalet opsparing pr. måned</small></div><div class="tile">Investering pr. måned<b>${fmt(investMonthly)}</b><small>planlagt beløb · <button type="button" class="linklike" data-go-tab="invest">Ret investering →</button></small></div><div class="tile">Nuværende buffer<b>${fmt(num('bufferCurrent'))}</b><small>registreret opsparing</small></div></div>
${deficitSavingsPanel(b)}
 ${annualReviewPanel()}
 <h3 class="sectionTitle">Hvor går pengene hen?</h3>${[...Object.entries(b.sums),['Investering',investMonthly]].map(([k,v])=>`<div class="chartrow"><span>${escapeHtml(k)}</span><div class="chartbar"><span style="width:${v/max*100}%"></span></div><b>${fmt(v)}</b></div>`).join('')}
 <p class="muted small">Investering er et planlagt beløb og ikke nødvendigvis en betaling, der allerede sker. Ret poster under <b>Alle budgetposter</b> og investering under <b>Investering og formue</b>.</p></div>`;}

$('load')?.addEventListener('click',()=>{try{const raw=localStorage.getItem(SAVE_KEY)||localStorage.getItem('pengepilot-v8')||localStorage.getItem('pengepilot-v7');if(!raw)throw Error();const x=JSON.parse(raw);restoreData(x.d&&x.edits?x:{d:x.d,edits:x.edits||{}})}catch{alert('Der blev ikke fundet et gyldigt, gemt budget i denne browser.')}});
$('download')?.addEventListener('click',()=>{clearTimeout(saveTimer);autoSave();download('Økonemt-sikkerhedskopi.json',JSON.stringify(packageData(),null,2),'application/json')});
$('import')?.addEventListener('click',()=>$('file').click());
$('file')?.addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>3000000)throw Error();const x=JSON.parse(await file.text());if(!validData(x))throw Error();if(!confirm('Indlæs budgetfilen? Dit nuværende budget på denne enhed vil blive erstattet.'))return;restoreData(x);alert('Budgettet er indlæst, inklusive lån, børn, fremtidskort og investeringer.')}catch{alert('Filen kunne ikke indlæses. Vælg en gyldig Økonemt JSON-sikkerhedskopi.')}});
$('exportcsv')?.addEventListener('click',()=>{const b=budget();const rows=[['Kategori','Budgetpost','Kr. pr. måned','Kr. pr. år'],['Indtægt','Husstandens indkomst',Math.max(0,Number(edits.income??d.income)||0),Math.max(0,Number(edits.income??d.income)||0)*12],...(d.otherIncomes||[]).map(x=>['Indtægt',x.name,Number(x.monthly)||0,(Number(x.monthly)||0)*12]),...b.items.map(x=>[x.cat,x.name,Math.round(x.val),Math.round(x.val*12)]),...b.future.map(x=>['Fremtidige udgifter',(x.customFuture?x.name:x.label),Math.round(x.monthly),Math.round(x.monthly*12)]),['Resultat','Tilbage',Math.round(b.left),Math.round(b.left*12)]];download('Økonemt-budget.csv','\ufeff'+rows.map(r=>r.join(';')).join('\r\n'),'text/csv;charset=utf-8')});}
function bindVehicleTypes(){document.querySelectorAll('[data-vehicle][data-vprop="type"]').forEach(el=>el.addEventListener('change',()=>{collectVehicles();$('vehiclesArea').innerHTML=vehicleFields();bindVehicleTypes()}));}
function bindLoanRemoval(){document.querySelectorAll('[data-remove-loan]').forEach(el=>el.onclick=()=>{collectLoans();rememberChange();d.loans.splice(Number(el.dataset.removeLoan),1);$('loansArea').innerHTML=loanFields();bindLoanRemoval()});}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}try{const stored=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(stored?.savedAt)lastSavedTimestamp=stored.savedAt;}catch(e){}showSaveDate();setupAutosave();draw();
</script></body></html>
