function electricCarComparison(futureItem){

 const current=Object.values(vehicleEnergy(v)).reduce((a,n)=>a+n,0);

 const electricity=km/12/100*sources.elecEfficiency*sources.electricRate;
 const difference=current-electricity;
 const annual=difference*12;
 const currentName=v.type==='diesel'?'Diesel':'Benzin';
 return `<details class="car-compare"><summary>Hvad hvis du skifter til elbil?</summary><div class="car-compare-grid"><span>${currentName} pr. måned</span><strong>${fmt(current)}</strong><span>Vejledende opladning pr. måned</span><strong>${fmt(electricity)}</strong><span>${difference>=0?'Mulig besparelse pr. måned':'Mulig merudgift pr. måned'}</span><strong>${fmt(Math.abs(difference))}</strong><span>${difference>=0?'Mulig besparelse pr. år':'Mulig merudgift pr. år'}</span><strong>${fmt(Math.abs(annual))}</strong></div><p class="muted small">Beregnet ved ${Math.round(km).toLocaleString('da-DK')} km/år. Forudsætter ${sources.elecEfficiency} kWh/100 km og ${sources.electricRate.toLocaleString('da-DK')} kr./kWh. Kun vejledende energiudgifter – ikke samlet biløkonomi. Bilens købspris, værditab, finansiering, forsikring og øvrig drift er ikke med.</p></details>`;
}

ed small future-price-note">Forventet pris om ${x.years} år: <b>${fmt(x.futureCost)}</b>${x.noInflation?' (ingen prisstigning)':' · heraf forventet stigning '+fmt(x.futureCost-x.cost)}${x.allocated?' · dækket af fælles opsparing '+fmt(x.allocated):''}${x.customFuture?' · mangler at spare op '+fmt(Math.max(0,x.futureCost-(Number(x.saved)||0)-(x.allocated||0))):''}</p><details class="future-extra-options"><summary>Flere muligheder</summary><div class="future-advanced-budget">${row('reserve|'+x.label,'Tilpas månedlig opsparing',x.monthly)}</div>${electricCarComparison(x)}${futureExtras(x)}<div class="local-tools">${localUndo(true)}</div></details></div><div class="future-close-row"><button class="secondary" type="button" data-future-close aria-label="Færdig med ændringer og luk kortet"><span aria-hidden="true">✓</span> Færdig</button></div></div></details></div>`).join('')+completedFuturePanel()+personalFutureForm();

function personalizedTips(b){

 if(b.future.length){const nearest=[...b.future].filter(x=>x.label!=='Nødbuffer').sort((a,c)=>a.years-c.years)[0];if(nearest)tips.push({target:'future-'+encodeURIComponent(nearest.label),title:'Se din næste store udgift',info:nearest.label+' ligger vejledende om '+nearest.years+' år. Kontrollér pris og tidspunkt.',tab:'future',priority:2});}

async function requestOkoInstall(helpElement){
 if(deferredInstallPrompt){const prompt=deferredInstallPrompt;deferredInstallPrompt=null;try{await prompt.prompt();const result=await prompt.userChoice;if(result?.outcome==='accepted')return true}catch(e){}}

function bindHeaderInstall(){

  const help=document.getElementById('headerInstallHelp');

  if(!help.hidden){help.hidden=true;button.setAttribute('aria-expanded','false');return;}

  button.setAttribute('aria-expanded',String(!help.hidden));
 });
}

// Locale-aware visual thousands grouping. Store and calculate unformatted numbers.
function formatMoneyInputs(root=document){
  root.querySelectorAll('input[type="number"]').forEach(el=>{
    if(el.dataset.moneyReady)return;
    const label=(el.closest('.field, .budget-cell, .inputrow')?.querySelector('label')?.textContent||el.closest('label')?.textContent||el.getAttribute('aria-label')||'').toLowerCase();
    const id=el.id||'';
    const isBudget=el.matches('[data-edit],[data-quarter],[data-annual],[data-new-month],[data-new-balance],[data-primary-income],[data-other-income]');
    const isMoneyId=/^(useFreeSavings|useExtraMonthly|investStart|investMonthly|savingsWithdrawal|deficitFreeSavings|extraPayment|appliancesCost|futureSavingsPool|bufferGoalFuture|bufferCurrentFuture|pfCost|pfSaved|otherIncomeAmount|travelAnnual|buffer|bufferCurrent|income|homepayment|otherPlans|streamMonthly|otherSubscriptions)$/i.test(id);
    const moneyData=el.matches('[data-future-cost],[data-future-saved],[data-personal-saved],[data-budget-loan],[data-debt-loan],[data-loan]') && !/år|rente|%|years|rate/i.test(label);
    const hasAmountLabel=/(kr\.|kroner|beløb|formue|opsparing|pris i dag|månedlig investering)/i.test(label) && !/(procent|%|antal år|prisstigning|afkast)/i.test(label);
    if(!(isBudget||isMoneyId||moneyData||hasAmountLabel))return;
    el.dataset.moneyReady='1';
    el.type='text';el.inputMode='numeric';el.autocomplete='off';
    el.value=groupDanishDigits(el.value);
  });
}
function groupDanishDigits(value){return String(value??'').replace(/[^0-9]/g,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function stripDanishDigits(value){return String(value??'').replace(/\./g,'');}
function fieldNumber(el){return el?.dataset?.moneyReady==='1'?moneyNumber(el.value):Number(el?.value)||0;}
function moneyNumber(value){const raw=String(value??'').trim().replace(/\s/g,'');if(!raw)return 0;const n=Number(raw.replace(/\./g,'').replace(',', '.'));return Number.isFinite(n)?n:0;}

document.addEventListener('input',e=>{
  const el=e.target;
  if(!el?.matches?.('input[data-money-ready]'))return;
  const old=el.value;const start=el.selectionStart??old.length;
  const digitsBefore=old.slice(0,start).replace(/\D/g,'').length;
  const next=groupDanishDigits(old);if(next===old)return;
  el.value=next;
  let pos=0,count=0;while(pos<next.length&&count<digitsBefore){if(/\d/.test(next[pos]))count++;pos++;}
  try{el.setSelectionRange(pos,pos)}catch{}
},true);
